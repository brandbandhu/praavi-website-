<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Thank You | Praavi Consultants</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=20260221" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #f7f4ef, #efe7dc 55%, #e6ddcf);
        color: #2b2b2b;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 20px;
      }
      .card {
        max-width: 640px;
        width: 100%;
        background: #ffffff;
        border-radius: 20px;
        padding: 36px 32px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.6;
        font-size: 16px;
      }
      .cta {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: #d97706;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .note {
        margin-top: 16px;
        font-size: 13px;
        color: #5b5b5b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Thanks for reaching out!</h1>
        <p>We have received your details and will contact you shortly with the next steps.</p>
        <a class="cta" href="/">Back to Praavi Consultants</a>
        <div class="note">If you need immediate help, call or WhatsApp our team.</div>
      </div>
    </div>
  </body>
</html>
